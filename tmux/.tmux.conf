# Set explicitly so tmux-sensible (on macOS) does not set it to
# "reattach-to-user-namespace -l $SHELL", which came out as /bin/sh (no starship).
# reattach-to-user-namespace is unnecessary since tmux 2.6.
set -g default-command "exec ${SHELL} -l"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'hiroppy/tmux-agent-sidebar'
set -g @dracula-plugins "cpu-usage ram-usage battery network-ping"

set-option -g @pane_resize "2"

set -g mouse on
set -g @dracula-show-left-icon session
set-window-option -g mode-keys vi
set -g renumber-windows on
set -g @sidebar_notifications off

# Clipboard: emit OSC 52 so selections reach the LOCAL terminal's clipboard
# (chopper is headless — no X clipboard — so this is how copy gets off the box).
# If a drag still doesn't copy, hold Shift to bypass tmux mouse mode entirely.
set -g set-clipboard on
# Tell tmux the outer terminal (xterm-256color over mosh/ssh) supports the OSC 52
# clipboard feature — without this, tmux won't emit OSC 52 over mosh and copy silently
# does nothing. This is the piece that makes copy work across mosh + tmux.
set -as terminal-features ',xterm*:clipboard'

# Forward modified keys (Shift/Ctrl/Alt + Enter, etc.) to apps via the CSI-u
# extended-keys protocol. 'always' emits the encoding outward regardless of what
# tmux thinks the outer terminal supports — needed for Shift+Enter in TUIs.
set -g extended-keys always
# Encode those keys in the CSI-u format (vs tmux's default 'xterm' format),
# which some TUIs expect for correct modified-key decoding.
# Guarded: extended-keys-format is tmux 3.5+; on older tmux (e.g. 3.4 on Ubuntu
# 24.04) an unguarded `set` prints "invalid option" on every start.
# NOTE: #{>=:} compares numerically, so this would misjudge a future 3.10.
%if #{>=:#{version},3.5}
set -g extended-keys-format csi-u
%endif

# Session persistence (resurrect = save/restore, continuum = automate it).
# @continuum-restore 'on' restores the last saved env when the tmux SERVER starts,
# i.e. on your first attach after a reboot (no boot/linger setup needed).
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'        # auto-save every 15 min ('0' to disable)
set -g @resurrect-capture-pane-contents 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
